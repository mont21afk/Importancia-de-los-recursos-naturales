<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Elegante</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background-image: url('imagenes/nagii.jpg'); /* Imagen local */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        .container {
            background: rgba(255, 255, 255, 0.28);
            padding: 45px;
            border-radius: 28px;
            width: 420px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            animation: fadeIn 1s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        h2 {
            font-size: 30px;
            margin-bottom: 12px;
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        p {
            font-size: 20px;
            color: #f1f1f1;
            margin-bottom: 20px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        input[type="text"] {
            width: 90%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
            transition: 0.3s;
            background: rgba(255,255,255,0.85);
        }

        input[type="text"]:focus {
            box-shadow: 0 0 8px rgba(255, 147, 227, 0.7);
            transform: scale(1.02);
        }

        button {
            margin-top: 25px;
            padding: 14px 32px;
            border: none;
            background: linear-gradient(135deg, #ff9aee, #ff7ab6, #ff4f87);
            color: white;
            font-size: 19px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            letter-spacing: 0.7px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 18px rgba(0,0,0,0.35);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container" id="formulario">
        <h2>Formulario</h2>
        <p>¿Cuál es tu nombre completo?</p>
        <input type="text" id="respuesta1" />
        <button onclick="siguiente(1)">Siguiente</button>
    </div>

    <script>
function siguiente(paso) {
    if (paso === 1) {
        window.location.href = 'prototipo_juego_recursos (1).html';
    }
    else if (paso === 2) {
        window.location.href = 'pregunta3.html';
    }
    else if (paso === 3) {
        window.location.href = 'final.html';
    }
}
    </script>
</body>
</html>
